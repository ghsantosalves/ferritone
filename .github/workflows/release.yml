name: Release

# Push a tag such as v0.1.3 to build the Debian package and open a draft release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential pkgconf cargo rustc python3 \
            dpkg-dev gh libglib2.0-dev-bin libgtk-4-dev libgstreamer1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - uses: actions/checkout@v7
      - name: Check that the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --locked --no-deps --format-version=1 |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build the package
        run: packaging/build-deb.sh
      - name: Prepare release assets
        run: |
          cd target/dist
          # GitHub replaces "~" in asset names with ".", so name the file the way it will be served.
          asset="ferritone_${VERSION}-1.trixie1_amd64.deb"
          cp "ferritone_${VERSION}-1~trixie1_amd64.deb" "$asset"
          sha256sum "$asset" > SHA256SUMS
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Write release notes
        run: |
          python3 - <<'PY' > notes.md
          import os, xml.etree.ElementTree as ET
          version = os.environ["VERSION"]
          asset = os.environ["ASSET"]
          root = ET.parse("assets/io.github.rustmusicplayer.Player.metainfo.xml").getroot()
          release = root.find(f"releases/release[@version='{version}']")
          summary = " ".join(p.text.strip() for p in release.iter("p")) if release is not None else ""
          print("## What's new\n")
          print(summary or "_Describe the changes in this release._")
          print("\n## Install (Debian 13 trixie, amd64)\n")
          print(f"```sh\nsudo apt install ./{asset}\n```\n")
          print("This upgrades earlier versions in place; your library and playlists are kept. "
                "Verify the download with `sha256sum -c SHA256SUMS`.\n")
          print("## Source\n")
          print("Ferritone is licensed under GPL-3.0-only. The source code for this release is in the "
                "archives below, and `packaging/build-deb.sh` builds the package.")
          PY
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Ferritone $VERSION" --notes-file notes.md \
            "target/dist/$ASSET" target/dist/SHA256SUMS
