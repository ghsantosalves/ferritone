<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1d1b">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ferritone">
<title>Ferritone</title>
<style>
  :root {
    --bg: #1e1d1b; --surface: #2a2926; --raised: #34332f; --text: #f2efe9;
    --muted: #a8a39a; --accent: #ee853f; --accent-text: #1e1d1b; --line: #3d3b37;
    --soft: color-mix(in srgb, var(--accent) 14%, transparent);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Cantarell, "Noto Sans", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.45 var(--font); -webkit-font-smoothing: antialiased;
    padding: max(14px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
    max-width: 540px; margin: 0 auto; position: relative; overflow-x: hidden;
    /* Its own layer, so the blurred cover sits above the page color and below the content. */
    isolation: isolate;
  }
  button { border: 0; background: none; color: inherit; padding: 0; cursor: pointer; font: inherit; }
  svg { fill: currentColor; }

  /* The album cover, blurred, tints the top of the page. */
  .backdrop { position: absolute; inset: 0 0 auto 0; height: 640px; overflow: hidden; z-index: -1;
    pointer-events: none; -webkit-mask-image: linear-gradient(#000 35%, transparent);
    mask-image: linear-gradient(#000 35%, transparent); }
  .backdrop img { width: 100%; height: 100%; object-fit: cover; filter: blur(60px) saturate(1.4);
    transform: scale(1.35); opacity: 0; transition: opacity .6s; }
  .backdrop img.shown { opacity: .42; }

  /* The player fills the first screen; the lists start below it. */
  .hero { display: flex; flex-direction: column; justify-content: space-between; gap: 18px;
    min-height: calc(100vh - max(14px, env(safe-area-inset-top)) - 24px);
    min-height: calc(100svh - max(14px, env(safe-area-inset-top)) - 24px); }
  .hero .now { flex: 1; justify-content: center; }
  .output { display: flex; align-items: center; gap: 12px; }
  .output-head { display: flex; align-items: center; justify-content: space-between; }
  .round { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--muted);
    background: color-mix(in srgb, var(--surface) 82%, transparent); flex: none; }
  .round svg { width: 18px; height: 18px; }
  .round[hidden] { display: none; }
  /* On phones the label goes above the choice, so neither label gets cut. */
  @media (max-width: 480px) {
    .output { flex-direction: column; align-items: stretch; gap: 7px; }
    .output-head { margin-left: 4px; }
  }
  .output-head span { color: var(--muted); font-size: .72rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .08em; white-space: nowrap; }
  .segmented { display: flex; gap: 2px; flex: 1; min-width: 0; padding: 3px; border-radius: 999px;
    background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(12px); }
  .segmented button { flex: 1 1 0; min-width: 0; height: 34px; padding: 0 8px; border-radius: 999px;
    color: var(--muted); font-size: 14px; font-weight: 650; display: flex; align-items: center;
    justify-content: center; gap: 6px; white-space: nowrap; transition: background .2s, color .2s; }
  .segmented button span { overflow: hidden; text-overflow: ellipsis; }
  .segmented button svg { width: 16px; height: 16px; flex: none; }
  .segmented button.on { background: var(--accent); color: var(--accent-text);
    box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); }

  .now { display: flex; flex-direction: column; align-items: center; }
  .cover { width: min(76vw, 320px); aspect-ratio: 1; border-radius: 20px; background: var(--surface);
    display: grid; place-items: center; overflow: hidden;
    box-shadow: 0 24px 60px rgb(0 0 0 / 32%), 0 2px 8px rgb(0 0 0 / 18%); }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: none; grid-area: 1 / 1; }
  .cover svg { width: 34%; color: var(--muted); grid-area: 1 / 1; }
  /* Tapping the cover shows the lyrics over a blurred copy of it. */
  .cover { position: relative; cursor: pointer; }
  /* The cover itself is blurred and dimmed, so the lines' fade at the edges never reveals it sharp. */
  .cover img, .cover > svg { transition: filter .3s, transform .3s; }
  .cover.show-lyrics { background: #242424; }
  .cover.show-lyrics img, .cover.show-lyrics > svg { filter: blur(22px) brightness(.42) saturate(1.3); transform: scale(1.2); }
  .lyrics { position: absolute; inset: 0; display: none; overflow-y: auto; padding: 40% 20px;
    text-align: center; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent);
    mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent); }
  .lyrics::-webkit-scrollbar { display: none; }
  .cover.show-lyrics .lyrics { display: block; }
  /* Every line keeps the same size and weight, so changing lines never reflows the text; the current
     one only brightens and grows a little through a transform. */
  .lyrics p { margin: 0 0 14px; color: rgb(255 255 255 / 55%); font-size: 1.06rem; font-weight: 750; line-height: 1.35;
    transform-origin: center; transform: scale(.94);
    transition: color .45s ease, opacity .45s ease, transform .45s cubic-bezier(.2, .8, .2, 1); }
  .lyrics p.past { opacity: .55; }
  .lyrics p.now { color: #fff; transform: scale(1.04); }
  .lyrics .plain { white-space: pre-wrap; color: #fff; font-weight: 600; text-align: center; }
  .lyrics .missing { color: rgb(255 255 255 / 70%); margin-top: 20%; }
  .lyrics-badge { position: absolute; right: 10px; bottom: 10px; width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center; background: rgb(0 0 0 / 45%); color: #fff;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); pointer-events: none; }
  .cover .lyrics-badge svg { width: 18px; height: 18px; color: #fff; }
  .meta { text-align: center; width: 100%; margin: 22px 0 16px; min-height: 3.4em; }
  .title { font-size: 1.42rem; font-weight: 750; letter-spacing: -.01em; line-height: 1.25;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .artist { color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Thin bars filled up to the value with the accent color. */
  input[type=range] { --fill: 0%; -webkit-appearance: none; appearance: none; width: 100%; height: 22px;
    margin: 0; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 999px;
    background: linear-gradient(to right, var(--accent) var(--fill), color-mix(in srgb, var(--text) 16%, transparent) var(--fill)); }
  input[type=range]::-moz-range-track { height: 5px; border-radius: 999px;
    background: linear-gradient(to right, var(--accent) var(--fill), color-mix(in srgb, var(--text) 16%, transparent) var(--fill)); }
  /* The ring around the knob only shows while it is being dragged. */
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; margin-top: -5px;
    border-radius: 50%; background: var(--accent); border: 0; box-shadow: 0 1px 3px rgb(0 0 0 / 25%);
    transition: transform .15s, box-shadow .15s; }
  input[type=range]::-moz-range-thumb { width: 15px; height: 15px; border-radius: 50%; background: var(--accent); border: 0;
    box-shadow: 0 1px 3px rgb(0 0 0 / 25%); }
  input[type=range]:active::-webkit-slider-thumb { transform: scale(1.2);
    box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 22%, transparent); }
  input[type=range]:active::-moz-range-thumb { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 22%, transparent); }
  .time { display: flex; justify-content: space-between; width: 100%; margin-top: 2px; color: var(--muted);
    font-size: .78rem; font-weight: 600; font-variant-numeric: tabular-nums; }

  .controls { display: flex; align-items: center; justify-content: space-between; width: 100%;
    max-width: 360px; margin: 14px 0 12px; }
  .controls button { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center;
    transition: background .15s, transform .1s; }
  .controls button:active { background: color-mix(in srgb, var(--text) 10%, transparent); transform: scale(.94); }
  .controls svg { width: 26px; height: 26px; }
  .controls .play { width: 74px; height: 74px; background: var(--accent); color: var(--accent-text);
    box-shadow: 0 12px 30px color-mix(in srgb, var(--accent) 40%, transparent); }
  .controls .play:active { background: var(--accent); }
  .controls .play svg { width: 34px; height: 34px; }
  .controls .toggle { color: var(--muted); }
  .controls .toggle.on { color: var(--accent); }
  .controls button:disabled { opacity: .3; }
  .badge { position: relative; }
  .badge span { position: absolute; right: 11px; bottom: 10px; font-size: 9px; font-weight: 800; }
  .volume { display: flex; align-items: center; gap: 12px; width: 100%; color: var(--muted); }
  .volume svg { width: 20px; height: 20px; flex: none; }

  .tabs { display: flex; gap: 4px; margin: 30px 0 14px; padding: 4px; border-radius: 16px; background: var(--surface); }
  .tabs button { flex: 1 1 0; min-width: 0; padding: 8px 4px 7px; border-radius: 12px; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .74rem; font-weight: 650;
    line-height: 1.2; text-align: center; transition: background .2s, color .2s; }
  .tabs button svg { width: 20px; height: 20px; }
  .tabs button.on { background: var(--raised); color: var(--text); }
  .tabs button.on svg { color: var(--accent); }
  .search { position: relative; margin-bottom: 10px; display: none; }
  .search svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; translate: 0 -50%; color: var(--muted); }
  .search input { width: 100%; height: 44px; border-radius: 14px; border: 1px solid transparent; background: var(--surface);
    color: var(--text); font: inherit; padding: 0 14px 0 42px; outline: none; transition: border-color .2s; }
  .search input:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
  .search input::placeholder { color: var(--muted); }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  li.track { display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 12px;
    padding: 7px 10px 7px 7px; border-radius: 14px; cursor: pointer; transition: background .15s; }
  li.track:active { background: color-mix(in srgb, var(--text) 8%, transparent); }
  li.track.current { background: var(--soft); }
  .thumb { position: relative; width: 48px; height: 48px; border-radius: 10px; overflow: hidden; display: grid;
    place-items: center; background: linear-gradient(135deg, var(--raised), var(--surface)); color: var(--muted); }
  .thumb > svg { width: 22px; height: 22px; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s; }
  .thumb img.shown { opacity: 1; }
  .thumb.list { background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 45%, var(--bg))); color: var(--accent-text); }
  /* Three bars that bounce on the track that is playing. */
  .bars { position: absolute; inset: 0; display: none; align-items: flex-end; justify-content: center; gap: 3px;
    padding-bottom: 14px; background: rgb(0 0 0 / 45%); }
  li.current .bars { display: flex; }
  .bars i { width: 4px; height: 6px; border-radius: 2px; background: #fff; }
  li.playing .bars i { animation: bounce .9s ease-in-out infinite; }
  .bars i:nth-child(2) { animation-delay: -.3s; }
  .bars i:nth-child(3) { animation-delay: -.6s; }
  @keyframes bounce { 0%, 100% { height: 6px; } 50% { height: 18px; } }
  .info { min-width: 0; }
  .info b, .info span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .info b { font-weight: 600; font-size: .97rem; }
  li.current .info b { color: var(--accent); }
  .info span { color: var(--muted); font-size: .82rem; margin-top: 1px; }
  .length { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
  .length svg { width: 20px; height: 20px; display: block; }
  li.more { display: flex; justify-content: center; padding: 10px 0; }
  li.more button { padding: 10px 20px; border-radius: 999px; background: var(--surface); color: var(--accent); font-weight: 650; }
  li.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 36px 16px;
    color: var(--muted); text-align: center; }
  li.empty svg { width: 36px; height: 36px; opacity: .5; }
  .notice { display: none; background: var(--surface); border-radius: 14px; margin-bottom: 14px; padding: 12px 14px;
    color: var(--muted); font-size: .9rem; text-align: center; }
  .footer { display: flex; justify-content: center; margin: 26px 0 6px; }
  .footer a { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px;
    background: var(--surface); color: var(--muted); font-size: .88rem; font-weight: 650; text-decoration: none; }
  .footer a svg { width: 18px; height: 18px; color: var(--accent); }
  audio { display: none; }
</style>
</head>
<body>

<div class="notice" id="notice"></div>
<div class="hero">

</div>
<div class="tabs">

  <button id="tab-playlists"><svg viewBox="0 0 24 24"><path d="M15 6H3v2h12zm0 4H3v2h12zM3 16h8v-2H3zM17 6v8.18A3 3 0 0 0 16 14a3 3 0 1 0 3 3V8h3V6z"/></svg><span></span></button>
</div>
<div class="search" id="search-box">
  <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.5 6.5 0 1 0 14 15.5l.27.28v.79l5 4.99L20.49 19zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
  <input id="search" type="search" autocomplete="off" enterkeyhint="search">
</div>
<ul id="list"></ul>
<div class="footer"><a id="shortcut"><svg viewBox="0 0 24 24"><path d="M17 1.01 7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14zm-4.2-5.78v1.75l3.2-2.99L12.8 9v1.7c-3.11.43-4.35 2.56-4.8 4.7 1.11-1.5 2.58-2.18 4.8-2.18z"/></svg><span id="shortcut-label"></span></a></div>

$("out-pc").onclick = () => setOutput("pc");
$("out-phone").onclick = () => setOutput("phone");
for (const name of ["queue", "library", "playlists"]) {
  $("tab-" + name).onclick = () => {
    tab = name; listKey = "";
    if (name === "library") loadLibrary();
    render();
  };
}
$("search").oninput = () => { query = $("search").value; shown = PAGE_SIZE; renderList(); };
setLyricsShown(showLyrics);
refresh();
setInterval(refresh, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
