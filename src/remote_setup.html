<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1e1d1b">
<title>Ferritone · Browser shortcut</title>
<style>
  :root { --bg: #1e1d1b; --surface: #2a2926; --raised: #34332f; --text: #f2efe9; --muted: #a8a39a;
          --accent: #ee853f; --accent-text: #1e1d1b; --line: #3d3b37; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Cantarell, sans-serif;
         max-width: 680px; margin: 0 auto; padding: 32px 20px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 26px; }
  ol { margin: 0; padding: 0; list-style: none; counter-reset: step; }
  li { counter-increment: step; position: relative; padding: 16px 16px 16px 60px; background: var(--surface);
       border-radius: 12px; margin-bottom: 12px; }
  li::before { content: counter(step); position: absolute; left: 16px; top: 15px; width: 30px; height: 30px;
               border-radius: 50%; background: var(--accent); color: var(--accent-text); font-weight: 800;
               display: grid; place-items: center; }
  .copy { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  code { background: var(--raised); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px;
         font: 14px ui-monospace, "DejaVu Sans Mono", monospace; }
  .copy code { border-radius: 8px; padding: 8px 12px; font-size: 15px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  button, a.button { background: var(--raised); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
         padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
  button.done { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  a.ferritone { color: var(--accent); font-weight: 700; }
  kbd { background: var(--raised); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px;
        padding: 1px 6px; font: 14px ui-monospace, monospace; }
  .note { color: var(--muted); font-size: .92rem; margin-top: 8px; }
  .try { margin-top: 26px; text-align: center; }
  .try a.button { background: var(--accent); color: var(--accent-text); border-color: var(--accent); padding: 12px 22px; }
  h2 { font-size: 1.05rem; margin: 22px 0 10px; }
  .install { display: none; margin-bottom: 18px; }
  .install button { background: var(--accent); color: var(--accent-text); border-color: var(--accent); padding: 12px 20px; }
</style>
</head>
<body>
<h1 id="heading"></h1>
<p class="lead" id="lead"></p>
<div class="install" id="install"><button id="install-button"></button></div>
<ol id="steps"></ol>
<div id="groups"></div>
<div class="try"><a class="button" id="try" href="/"></a></div>
<script>
"use strict";
const params = new URLSearchParams(location.search);
const token = params.get("t") || "";
// Phones carry the token from the QR code link; this computer's browser needs none.
function api(path) { return token ? path + (path.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(token) : path; }
const home = location.origin + "/";
const browser = params.get("browser") || "other";
const onComputer = ["localhost", "127.0.0.1", "ferritone"].includes(location.hostname);
const mobile = params.get("device") === "mobile" || (params.get("device") !== "computer" && !onComputer);
const apple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent) && "ontouchend" in document;
const mobileText = {
  en: { heading: "Ferritone on your home screen",

          "Tap <b>Add to Home screen</b> (on some phones, <b>Install app</b>).",

        ios: ["iPhone and iPad (Safari)", ["Tap <b>Share</b> (the square with an arrow pointing up).",
          "Scroll and tap <b>Add to Home Screen</b>.", "Tap <b>Add</b>."]],
        note: "The shortcut works on the same Wi-Fi network while Ferritone is open on the computer. If the computer's address changes, for example after the router restarts, scan the QR code again and recreate the shortcut." },
  pt: { heading: "Ferritone na tela inicial",
        lead: "Crie um atalho que abre o controle remoto com um toque, como um app. Ele já guarda o código de acesso.",
        install: "Instalar o Ferritone",
        android: ["Android (Chrome)", ["Toque no menu <b>⋮</b>, no canto superior direito do Chrome.",
          "Toque em <b>Adicionar à tela inicial</b> (em alguns aparelhos, <b>Instalar app</b>).",
          "Confirme em <b>Adicionar</b>. O ícone do Ferritone aparece na tela inicial."]],
        ios: ["iPhone e iPad (Safari)", ["Toque em <b>Compartilhar</b> (o quadrado com uma seta para cima).",
          "Role e toque em <b>Adicionar à Tela de Início</b>.", "Toque em <b>Adicionar</b>."]],
        note: "O atalho funciona na mesma rede Wi-Fi e com o Ferritone aberto no computador. Se o endereço do computador mudar, por exemplo depois de reiniciar o roteador, escaneie o QR code de novo e recrie o atalho." },
  es: { heading: "Ferritone en la pantalla de inicio",
        lead: "Crea un acceso que abre el control remoto con un toque, como una app. Guarda el código de acceso.",
        install: "Instalar Ferritone",
        android: ["Android (Chrome)", ["Toca el menú <b>⋮</b> arriba a la derecha de Chrome.",
          "Toca <b>Añadir a pantalla de inicio</b> (en algunos móviles, <b>Instalar aplicación</b>).",
          "Confirma con <b>Añadir</b>. El icono de Ferritone aparece en la pantalla de inicio."]],
        ios: ["iPhone y iPad (Safari)", ["Toca <b>Compartir</b> (el cuadrado con una flecha hacia arriba).",
          "Desplázate y toca <b>Añadir a pantalla de inicio</b>.", "Toca <b>Añadir</b>."]],
        note: "El acceso funciona en la misma red Wi-Fi mientras Ferritone esté abierto en el equipo. Si la dirección del equipo cambia, por ejemplo al reiniciar el router, escanea el código QR de nuevo y vuelve a crear el acceso." },
  fr: { heading: "Ferritone sur l’écran d’accueil",
        lead: "Ajoutez un raccourci qui ouvre la télécommande d’un geste, comme une app. Il garde le code d’accès.",
        install: "Installer Ferritone",
        android: ["Android (Chrome)", ["Touchez le menu <b>⋮</b> en haut à droite de Chrome.",
          "Touchez <b>Ajouter à l’écran d’accueil</b> (sur certains téléphones, <b>Installer l’application</b>).",
          "Confirmez avec <b>Ajouter</b>. L’icône de Ferritone apparaît sur l’écran d’accueil."]],
        ios: ["iPhone et iPad (Safari)", ["Touchez <b>Partager</b> (le carré avec une flèche vers le haut).",
          "Faites défiler et touchez <b>Sur l’écran d’accueil</b>.", "Touchez <b>Ajouter</b>."]],
        note: "Le raccourci fonctionne sur le même réseau Wi-Fi tant que Ferritone est ouvert sur l’ordinateur. Si l’adresse de l’ordinateur change, par exemple après un redémarrage de la box, scannez à nouveau le code QR et recréez le raccourci." },
};
// Browsers that allow it offer a one-tap install; it needs a secure page, so on most home
// networks the steps below are the way.
let installPrompt = null;
window.addEventListener("beforeinstallprompt", event => {
  event.preventDefault(); installPrompt = event;
  document.getElementById("install").style.display = "block";
});
document.getElementById("install-button").onclick = () => installPrompt && installPrompt.prompt();
for (const [rel, href] of [["manifest", api("/manifest.webmanifest")], ["apple-touch-icon", api("/icon-192.png")]]) {
  const link = document.createElement("link"); link.rel = rel; link.href = href; document.head.append(link);
}
function renderMobile(language) {
  const words = mobileText[language] || mobileText.en;
  document.documentElement.lang = language;
  document.getElementById("heading").textContent = words.heading;
  document.getElementById("lead").textContent = words.lead;
  document.getElementById("install-button").textContent = words.install;
  document.getElementById("try").textContent = (text[language] || text.en).tryIt;
  document.getElementById("steps").style.display = "none";
  const groups = document.getElementById("groups"); groups.replaceChildren();
  // The steps for this device come first.
  for (const [title, steps] of apple ? [words.ios, words.android] : [words.android, words.ios]) {
    const heading = document.createElement("h2"); heading.textContent = title;
    const list = document.createElement("ol");
    for (const step of steps) { const li = document.createElement("li"); li.innerHTML = step; list.append(li); }
    groups.append(heading, list);
  }
  const note = document.createElement("p"); note.className = "note"; note.textContent = words.note;
  groups.append(note);
}
const text = {
  en: {
    heading: "Open Ferritone by typing “ferritone”",
    lead: "Set this up once. Afterwards, while Ferritone is open, typing ferritone in the address bar opens the player.",
    copy: "Copy", copied: "Copied", tryIt: "Open the player",
    firefox: [
      "Right-click this link and choose <b>Bookmark Link…</b>: {link}",
      "In <b>Keyword</b>, type <code>ferritone</code> and click <b>Save</b>. If the window has no Keyword field, open <b>Bookmarks → Manage Bookmarks</b>, select Ferritone, and fill it in there.",
      "Done. Type <kbd>ferritone</kbd> in the address bar and press <kbd>Enter</kbd>.",
    ],
    chromium: [
      "Copy this address, paste it in the address bar, and press <kbd>Enter</kbd> to open the search settings: {settings}",
      "Under <b>Site search</b>, click <b>Add</b>.",
      "Fill in the three fields and click <b>Add</b>:<br>Name: <code>Ferritone</code><br>Shortcut: <code>ferritone</code><br>URL: {template}",
      "Done. Type <kbd>ferritone</kbd>, press <kbd>Tab</kbd>, then <kbd>Enter</kbd>.",
    ],
    other: [
      "Bookmark this address, or drag this link to the bookmarks bar: {link}",
      "If your browser lets bookmarks have a keyword, give it the keyword <code>ferritone</code>.",
      "Open the bookmark, or type its keyword, whenever Ferritone is open.",
    ],
    note: "The address works only on this computer and only while Ferritone is open. Nothing goes through the internet.",
  },
  pt: {
    heading: "Abra o Ferritone digitando “ferritone”",
    lead: "Configure uma vez. Depois, com o Ferritone aberto, digitar ferritone na barra de endereço abre o player.",
    copy: "Copiar", copied: "Copiado", tryIt: "Abrir o player",
    firefox: [
      "Clique com o botão direito neste link e escolha <b>Adicionar link aos favoritos…</b>: {link}",
      "Em <b>Palavra-chave</b>, escreva <code>ferritone</code> e clique em <b>Salvar</b>. Se a janela não tiver o campo Palavra-chave, abra <b>Favoritos → Gerenciar favoritos</b>, selecione Ferritone e preencha lá.",
      "Pronto. Digite <kbd>ferritone</kbd> na barra de endereço e aperte <kbd>Enter</kbd>.",
    ],
    chromium: [
      "Copie este endereço, cole na barra de endereço e aperte <kbd>Enter</kbd> para abrir as configurações de pesquisa: {settings}",
      "Em <b>Pesquisa no site</b>, clique em <b>Adicionar</b>.",
      "Preencha os três campos e clique em <b>Adicionar</b>:<br>Nome: <code>Ferritone</code><br>Atalho: <code>ferritone</code><br>URL: {template}",
      "Pronto. Digite <kbd>ferritone</kbd>, aperte <kbd>Tab</kbd> e depois <kbd>Enter</kbd>.",
    ],
    other: [
      "Adicione este endereço aos favoritos ou arraste este link para a barra de favoritos: {link}",
      "Se o seu navegador permitir palavra-chave em favoritos, use a palavra-chave <code>ferritone</code>.",
      "Abra o favorito, ou digite a palavra-chave, sempre que o Ferritone estiver aberto.",
    ],
    note: "O endereço só funciona neste computador e só com o Ferritone aberto. Nada passa pela internet.",
  },
  es: {
    heading: "Abre Ferritone escribiendo «ferritone»",
    lead: "Configúralo una vez. Después, con Ferritone abierto, escribir ferritone en la barra de direcciones abre el reproductor.",
    copy: "Copiar", copied: "Copiado", tryIt: "Abrir el reproductor",
    firefox: [
      "Haz clic derecho en este enlace y elige <b>Añadir enlace a marcadores…</b>: {link}",
      "En <b>Palabra clave</b>, escribe <code>ferritone</code> y haz clic en <b>Guardar</b>. Si la ventana no tiene ese campo, abre <b>Marcadores → Administrar marcadores</b>, selecciona Ferritone y rellénalo allí.",
      "Listo. Escribe <kbd>ferritone</kbd> en la barra de direcciones y pulsa <kbd>Intro</kbd>.",
    ],
    chromium: [
      "Copia esta dirección, pégala en la barra de direcciones y pulsa <kbd>Intro</kbd> para abrir la configuración de búsqueda: {settings}",
      "En <b>Búsqueda en sitios</b>, haz clic en <b>Añadir</b>.",
      "Rellena los tres campos y haz clic en <b>Añadir</b>:<br>Nombre: <code>Ferritone</code><br>Combinación de teclas: <code>ferritone</code><br>URL: {template}",
      "Listo. Escribe <kbd>ferritone</kbd>, pulsa <kbd>Tab</kbd> y luego <kbd>Intro</kbd>.",
    ],

      "Añade esta dirección a marcadores o arrastra este enlace a la barra de marcadores: {link}",
      "Si tu navegador admite palabras clave en marcadores, usa la palabra clave <code>ferritone</code>.",
      "Abre el marcador, o escribe la palabra clave, siempre que Ferritone esté abierto.",
    ],
    note: "La dirección solo funciona en este equipo y solo con Ferritone abierto. Nada pasa por internet.",
  },
  fr: {
    heading: "Ouvrez Ferritone en tapant « ferritone »",
    lead: "Configurez-le une fois. Ensuite, tant que Ferritone est ouvert, taper ferritone dans la barre d’adresse ouvre le lecteur.",
    copy: "Copier", copied: "Copié", tryIt: "Ouvrir le lecteur",
    firefox: [
      "Faites un clic droit sur ce lien et choisissez <b>Marquer ce lien…</b> : {link}",
      "Dans <b>Mot-clé</b>, tapez <code>ferritone</code> et cliquez sur <b>Enregistrer</b>. Si la fenêtre n’a pas de champ Mot-clé, ouvrez <b>Marque-pages → Gérer les marque-pages</b>, sélectionnez Ferritone et remplissez-le là.",
      "C’est prêt. Tapez <kbd>ferritone</kbd> dans la barre d’adresse et appuyez sur <kbd>Entrée</kbd>.",
    ],
    chromium: [
      "Copiez cette adresse, collez-la dans la barre d’adresse et appuyez sur <kbd>Entrée</kbd> pour ouvrir les paramètres de recherche : {settings}",
      "Sous <b>Recherche sur site</b>, cliquez sur <b>Ajouter</b>.",
      "Remplissez les trois champs et cliquez sur <b>Ajouter</b> :<br>Nom : <code>Ferritone</code><br>Raccourci : <code>ferritone</code><br>URL : {template}",
      "C’est prêt. Tapez <kbd>ferritone</kbd>, appuyez sur <kbd>Tab</kbd>, puis sur <kbd>Entrée</kbd>.",
    ],
    other: [
      "Ajoutez cette adresse aux marque-pages ou faites glisser ce lien vers la barre de marque-pages : {link}",
      "Si votre navigateur permet un mot-clé pour les marque-pages, utilisez le mot-clé <code>ferritone</code>.",
      "Ouvrez le marque-page, ou tapez le mot-clé, tant que Ferritone est ouvert.",
    ],
    note: "L’adresse ne fonctionne que sur cet ordinateur et seulement quand Ferritone est ouvert. Rien ne passe par internet.",
  },
};
// A copyable value; the buttons get their handlers once the step is on the page.
function copyBox(value, words) {
  return `<div class="copy"><code>${value}</code><button data-copy="${value}">${words.copy}</button></div>`;
}
function render(language) {
  const words = text[language] || text.en;
  document.documentElement.lang = language;
  document.getElementById("heading").textContent = words.heading;
  document.getElementById("lead").textContent = words.lead;
  document.getElementById("try").textContent = words.tryIt;
  const link = `<a class="ferritone" href="${home}">Ferritone</a>`;
  const settings = browser === "edge" ? "edge://settings/searchEngines"
    : browser === "brave" ? "brave://settings/searchEngines"
    : browser === "vivaldi" ? "vivaldi://settings/searchEngines" : "chrome://settings/searchEngines";
  const steps = text[language] ? words[browser === "firefox" ? "firefox" : browser === "other" ? "other" : "chromium"]
                               : text.en.other;
  const list = document.getElementById("steps"); list.replaceChildren();
  for (const step of steps) {
    const li = document.createElement("li");
    li.innerHTML = step
      .replace("{link}", link + copyBox(home, words))
      .replace("{settings}", copyBox(settings, words))
      .replace("{template}", copyBox(home + "#%s", words));
    list.append(li);
  }
  const note = document.createElement("p"); note.className = "note"; note.textContent = words.note;
  list.after(note);
  for (const button of document.querySelectorAll("button[data-copy]")) {
    const value = button.dataset.copy;
    button.onclick = () => navigator.clipboard.writeText(value).then(() => {
      button.textContent = words.copied; button.classList.add("done");
      setTimeout(() => { button.textContent = words.copy; button.classList.remove("done"); }, 1800);
    });
  }
}
// Follows the theme and accent chosen in Ferritone's preferences.
let paletteKey = "";
function applyPalette(palette) {
  if (!palette || !palette.background) return;
  const key = JSON.stringify(palette);
  if (key === paletteKey) return;
  paletteKey = key;
  const root = document.documentElement.style;
  for (const [name, value] of Object.entries({
    bg: palette.background, surface: palette.surface, raised: palette.raised, text: palette.text,
    muted: palette.muted, line: palette.line, accent: palette.accent, "accent-text": palette.accent_text,
  })) root.setProperty("--" + name, value);
  document.documentElement.style.colorScheme = palette.dark ? "dark" : "light";
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = palette.background;
}
document.getElementById("try").href = api("/");
const draw = language => (mobile ? renderMobile : render)(language);
fetch(api("/api/state")).then(r => r.json()).then(state => { applyPalette(state.palette); draw(state.language); })
  .catch(() => draw("en"));
</script>
</body>
</html>
